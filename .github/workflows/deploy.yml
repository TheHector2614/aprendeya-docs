name: Deploy AprendeYa Agent to OCI

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "Dockerfile"
      - "docs-management/**"
      - "raw/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  OCI_REGION: us-ashburn-1
  DOCKER_IMAGE_NAME: aprendeya-agent

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCI CLI
        uses: oracle-actions/setup-cli@v1
        with:
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ env.OCI_REGION }}

      - name: Log in to OCIR
        run: |
          echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login \
            ${{ env.OCI_REGION }}.ocir.io \
            -u ${{ secrets.OCI_USER_NAME }} \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            --cache-from ${{ env.OCI_REGION }}.ocir.io/${{ vars.OCI_OBJECT_STORAGE_NS }}/${{ env.DOCKER_IMAGE_NAME }}:latest \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.OCI_REGION }}.ocir.io/${{ vars.OCI_OBJECT_STORAGE_NS }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.OCI_REGION }}.ocir.io/${{ vars.OCI_OBJECT_STORAGE_NS }}/${{ env.DOCKER_IMAGE_NAME }}:latest \
            .

      - name: Push to OCIR
        run: |
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ vars.OCI_OBJECT_STORAGE_NS }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.OCI_REGION }}.ocir.io/${{ vars.OCI_OBJECT_STORAGE_NS }}/${{ env.DOCKER_IMAGE_NAME }}:latest

  deploy:
    name: Deploy to OCI
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up OCI CLI
        uses: oracle-actions/setup-cli@v1
        with:
          tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          user: ${{ secrets.OCI_USER_OCID }}
          fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          region: ${{ env.OCI_REGION }}

      - name: Retrieve secret from OCI Vault
        id: get-secret
        run: |
          SECRET_B64=$(oci kms management secret get \
            --secret-id "${{ vars.OCI_VAULT_SECRET_ID }}" \
            --query "data.\"secret-content\".content" --raw-output)
          echo "groq_key=$(echo $SECRET_B64 | base64 -d)" >> $GITHUB_OUTPUT

      - name: Update Container Instance
        run: |
          oci compute-container-instance container-instance update \
            --container-instance-id "${{ vars.OCI_CONTAINER_INSTANCE_ID }}" \
            --containers "[{
              \"displayName\":\"aprendeya-agent-container\",
              \"imageUrl\":\"${{ env.OCI_REGION }}.ocir.io/${{ vars.OCI_OBJECT_STORAGE_NS }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}\",
              \"environmentVariables\":{
                \"GROQ_API_KEY\":\"${{ steps.get-secret.outputs.groq_key }}\",
                \"OCI_OBJECT_STORAGE_BUCKET\":\"${{ vars.OCI_OBJECT_STORAGE_BUCKET }}\",
                \"OCI_OBJECT_STORAGE_NAMESPACE\":\"${{ vars.OCI_OBJECT_STORAGE_NS }}\"
              }
            }]" \
            --force

      - name: Wait for health check via Load Balancer
        run: |
          LB_IP=$(oci lb load-balancer get \
            --load-balancer-id "${{ vars.OCI_LB_ID }}" \
            --query "data.\"ip-addresses\"[0].\"ip-address\"" --raw-output)
          echo "Waiting for $LB_IP:80/health..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${LB_IP}:80/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Deploy successful!"
              echo "URL: http://$LB_IP:80/"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after 150s"
          exit 1
