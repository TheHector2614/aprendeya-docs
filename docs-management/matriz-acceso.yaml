# =============================================================================
# MATRIZ DE ACCESO — AprendeYa
# =============================================================================
# Define qué fuentes puede leer el agente de IA, cómo se conecta y
# quién aprueba los cambios en cada fuente.

fuentes:

  # ────────────────────────────────────────────────────────────────────────────
  # SITIO WEB (estático, contenido ya generado)
  # ────────────────────────────────────────────────────────────────────────────
  - id: WEB-001
    nombre: "Sitio web AprendeYa"
    tipo: "estático"
    url: "https://aprendeya-docs.vercel.app"
    metodo_conexion: "lectura HTTP"
    autenticacion: false
    alcance: "Documentos públicos: reglamento, políticas, FAQ, guías"
    permisos_agente: ["lectura"]
    responsable_actualizacion: "Dirección Académica"

