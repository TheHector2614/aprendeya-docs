<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AprendeYa — Asistente Documental</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f1f5f9; height: 100vh; display: flex; flex-direction: column; }
header { background: #2563eb; color: white; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
header h1 { font-size: 1.25rem; font-weight: 600; }
header span { font-size: 0.875rem; opacity: 0.8; }
#chat { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; max-width: 48rem; margin: 0 auto; width: 100%; }
.msg { display: flex; gap: 0.75rem; max-width: 85%; animation: fadeIn .3s ease; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.bot { align-self: flex-start; }
.avatar { width: 2rem; height: 2rem; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; flex-shrink: 0; }
.msg.user .avatar { background: #2563eb; color: white; }
.msg.bot .avatar { background: #059669; color: white; }
.bubble { background: white; padding: 0.75rem 1rem; border-radius: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); line-height: 1.6; font-size: 0.9375rem; color: #1e293b; }
.msg.user .bubble { background: #2563eb; color: white; border-bottom-right-radius: 0.25rem; }
.msg.bot .bubble { border-bottom-left-radius: 0.25rem; }
.fuentes { margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid #e2e8f0; font-size: 0.8rem; }
.fuentes strong { color: #64748b; }
.fuente-item { display: inline-block; background: #f1f5f9; padding: 0.125rem 0.5rem; border-radius: 999px; margin: 0.125rem; font-size: 0.75rem; color: #475569; }
#input-area { background: white; border-top: 1px solid #e2e8f0; padding: 1rem 1.5rem; }
#form { max-width: 48rem; margin: 0 auto; display: flex; gap: 0.5rem; }
#input { flex: 1; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 999px; font-size: 0.9375rem; outline: none; transition: border-color .2s; }
#input:focus { border-color: #2563eb; }
#send-btn { background: #2563eb; color: white; border: none; width: 2.75rem; height: 2.75rem; border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s; }
#send-btn:hover { background: #1e40af; }
#send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.typing .bubble::after { content: '...'; animation: dots 1.5s steps(4, end) infinite; }
@keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8; text-align: center; padding: 2rem; }
.empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
.empty-state h2 { font-size: 1.125rem; color: #64748b; margin-bottom: 0.5rem; }
.empty-state p { font-size: 0.875rem; max-width: 20rem; }
</style>
</head>
<body>
<header>
  <div style="width:2rem;height:2rem;background:#fff3;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:1rem;">A</div>
  <div><h1>AprendeYa</h1><span>Asistente Documental</span></div>
</header>

<div id="chat">
  <div class="empty-state" id="empty-state">
    <div class="icon">🎓</div>
    <h2>Pregúntame sobre AprendeYa</h2>
    <p>Ej: ¿Cuál es la política de reembolso? ¿Cómo obtengo mi certificado? ¿Qué becas hay disponibles?</p>
  </div>
</div>

<div id="input-area">
  <form id="form" autocomplete="off">
    <input id="input" type="text" placeholder="Escribe tu pregunta..." required>
    <button id="send-btn" type="submit" aria-label="Enviar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="m22 2-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
</div>

<script>
const API = '/ask';
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const emptyState = document.getElementById('empty-state');

function addMessage(role, text, fuentes) {
  emptyState?.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = role === 'user' ? 'T' : 'A';
  div.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble"><div class="text">${text}</div></div>
  `;
  if (fuentes?.length > 0) {
    const fDiv = div.querySelector('.bubble');
    const html = fuentes.map(f =>
      `<span class="fuente-item">${f.titulo} (${(f.relevancia * 100).toFixed(0)}%)</span>`
    ).join('');
    fDiv.innerHTML += `<div class="fuentes"><strong>Fuentes:</strong> ${html}</div>`;
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  emptyState?.remove();
  const div = document.createElement('div');
  div.className = 'msg bot typing';
  div.id = 'typing-indicator';
  div.innerHTML = `<div class="avatar">A</div><div class="bubble"></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  document.getElementById('typing-indicator')?.remove();
}

async function ask(question) {
  addMessage('user', question);
  addTyping();
  input.disabled = true;
  sendBtn.disabled = true;
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, top_k: 3 }),
    });
    const data = await res.json();
    removeTyping();
    const text = data.respuesta.replace(/\n/g, '<br>');
    addMessage('bot', text, data.fuentes);
  } catch {
    removeTyping();
    addMessage('bot', 'Error al conectar con el servidor. Asegúrate de que la API esté ejecutándose.');
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) { input.value = ''; ask(q); }
});

ask('¿Qué documentos están disponibles?');
</script>
</body>
</html>
